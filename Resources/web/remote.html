<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiveRack">
<link rel="apple-touch-icon" href="/icon.png">
<title>LiveRack Remote</title>
<style>
  :root {
    --bg: #121417; --panel: #1d2126; --raised: #262a30; --border: #2f353c;
    --text: #e6e8eb; --dim: #9aa3ad; --accent: #4a90d9; --accent-deep: #24364c;
    --amber: #e0a030; --green: #3fb950; --red: #d95454;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 1px solid var(--border); background: var(--raised); border-radius: 10px; min-height: 44px; padding: 0 14px; font-weight: 600; }
  button:active { filter: brightness(1.2); }
  button.on { background: var(--accent-deep); border-color: var(--accent); }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1a1d21; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 19px; margin-right: 6px; display: flex; align-items: center; gap: 8px; }
  .logo img { width: 28px; height: 28px; border-radius: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 36px; border-radius: 18px; background: var(--raised); font-weight: 600; font-size: 14px; }
  .light { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .light.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .light.bad { background: var(--red); }
  .spacer { flex: 1; }
  .bpm { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .bpm div { padding: 2px 12px; background: var(--raised); display: flex; flex-direction: column; justify-content: center; }
  .bpm small { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .6px; }
  .bpm b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .bpm button { border: 0; border-radius: 0; background: var(--accent-deep); font-weight: 800; letter-spacing: .6px; min-width: 64px; }

  .pages { display: flex; gap: 6px; padding: 8px 14px 0; overflow-x: auto; }
  .pages button { white-space: nowrap; }

  main { flex: 1; overflow-x: auto; overflow-y: hidden; display: flex; gap: 10px; padding: 10px 14px; align-items: stretch; }
  .strip { width: 168px; flex: 0 0 168px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .strip.sel { box-shadow: 0 0 0 2px var(--sel, var(--accent)); }
  .strip.byp { opacity: .65; }
  .head { padding: 10px; color: #101214; font-weight: 800; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .tag { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: rgba(0,0,0,.25); }
  .slots { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .slot { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; border-radius: 8px; background: var(--raised); border: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .slot .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.byp { opacity: .5; }
  .slot.open { border-color: var(--accent); background: var(--accent-deep); }
  .slot .sp { width: 4px; align-self: stretch; margin: 8px 0; border-radius: 2px; background: var(--accent); }
  .slot .b { font-size: 11px; color: var(--amber); font-weight: 800; }
  .meter { height: 6px; margin: 0 8px; border-radius: 3px; background: #101214; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--green) 70%, #d9c94a 88%, var(--red)); }
  .foot { display: flex; gap: 6px; padding: 8px; align-items: center; }
  .foot button { flex: 1; font-size: 13px; letter-spacing: .5px; }
  .foot button.byp { background: var(--amber); color: #101214; border-color: var(--amber); }
  .gr { font-size: 12px; color: var(--amber); font-weight: 700; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

  footer { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: #16191c; }
  footer button { min-height: 56px; font-size: 13px; padding: 4px 6px; line-height: 1.15; overflow: hidden; }
  footer button.lit { background: var(--amber); border-color: var(--amber); color: #101214; }

  /* Plugin parameters */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet.show { display: flex; }
  .panel { width: min(900px, 100%); height: 82%; background: var(--panel); border: 1px solid var(--border); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  .ptitle { display: flex; gap: 10px; align-items: center; padding: 14px; border-bottom: 1px solid var(--border); }
  .ptitle .t { flex: 1; font-weight: 800; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptitle .t span { color: var(--dim); font-weight: 600; }
  .ptitle input { height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 0 12px; font: inherit; width: 180px; }
  .params { flex: 1; overflow-y: auto; padding: 8px 14px 20px; }
  .param { display: grid; grid-template-columns: 34% 1fr 110px; gap: 12px; align-items: center; min-height: 52px; border-bottom: 1px solid #22262b; }
  .param .pn { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .param .pv { font-size: 14px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), #343a42 var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #e6e8eb; margin-top: -11px; border: 0; }
  .ro { height: 10px; border-radius: 5px; background: #101214; overflow: hidden; }
  .ro i { display: block; height: 100%; background: var(--amber); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  /* The plugin's own window */
  .gui { position: fixed; inset: 0; background: #0b0c0e; display: none; flex-direction: column; z-index: 15;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .gui.show { display: flex; }
  .gbar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: #1a1d21; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .gbar .t { flex: 1; min-width: 120px; font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
  .gbar .t span { color: var(--dim); font-weight: 600; }
  .gbar button { flex: 0 0 auto; padding: 0 12px; }
  .gbar .sepv { width: 1px; align-self: stretch; background: var(--border); margin: 4px 2px; flex: 0 0 1px; }
  .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .stage canvas { touch-action: none; background: #000; box-shadow: 0 0 0 1px var(--border); image-rendering: auto; transform-origin: 0 0; }
  .gmsg { position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; padding: 40px; color: var(--text); font-size: 16px; line-height: 1.45; background: rgba(11,12,14,.85); }
  .gmsg.show { display: flex; }
  .gmsg p { max-width: 640px; margin: 0; }
  .gstat { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #5c646d; font-variant-numeric: tabular-nums; pointer-events: none; }
  #kbd { position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; font-size: 16px; }
  .mlist { flex: 1; overflow-y: auto; padding: 6px 14px 20px; }
  .mitem { min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #22262b; font-size: 15px; font-weight: 600; }
  .mitem:active { background: var(--raised); }
  .mitem.off { color: #5c646d; }
  .mitem .ck { width: 18px; color: var(--accent); }
  .mitem .ar { color: var(--dim); }
  .msep { height: 1px; background: var(--border); margin: 6px 0; }
  .offline { position: fixed; top: 0; left: 0; right: 0; background: var(--red); color: white; text-align: center; padding: 6px; font-weight: 700; display: none; z-index: 20; }
  /* Edit mode: building the show from here */
  button.edit.on { background: var(--amber); border-color: var(--amber); color: #101214; }
  .showbtn { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .showbtn .dot { color: var(--amber); }
  .addp { min-height: 40px; border-style: dashed; background: transparent; color: var(--dim); font-size: 13px; }
  .addrack { width: 140px; flex: 0 0 140px; border: 2px dashed var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--dim); font-weight: 700; font-size: 15px; }
  body.editing .strip { box-shadow: 0 0 0 1px var(--amber); }
  body.editing .head::after { content: '\2699'; font-size: 15px; opacity: .7; }
  .form { flex: 1; overflow-y: auto; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .form label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .4px; text-transform: uppercase; }
  .form input[type=text], .form input[type=number], .form select { height: 46px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 0 12px; font: inherit; font-size: 16px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .form .row { display: flex; gap: 10px; }
  .form .row > * { flex: 1; min-width: 0; }
  .seg { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: var(--raised); }
  .seg button.on { background: var(--accent-deep); box-shadow: inset 0 0 0 2px var(--accent); }
  .form .danger { background: transparent; border-color: var(--red); color: var(--red); }
  .form .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ask { background: #2a2416; border: 1px solid var(--amber); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-weight: 600; }
  .ask .row button { flex: 1; }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.4; }
  .note { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #2b3138; border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 40; max-width: 90%; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .note.show { display: block; }
  .pcat { font-size: 12px; color: var(--dim); font-weight: 600; }
</style>
</head>
<body>
<div class="offline" id="offline">Not connected to LiveRack</div>
<header>
  <div class="logo"><img src="/icon.png" alt="">LiveRack</div>
  <div class="chip"><span class="light" id="light"></span><span id="scene">Scene -</span></div>
  <button id="prev">&lsaquo; Scene</button><button id="next">Scene &rsaquo;</button>
  <div class="spacer"></div>
  <button id="appsBtn" style="display:none">Apps</button>
  <button class="showbtn" id="showBtn">Show</button>
  <button class="edit" id="editBtn">Edit</button>
  <div class="bpm"><div><small>BPM</small><b id="bpm">120</b></div><button id="tap">TAP</button></div>
</header>
<div class="pages" id="pages"></div>
<main id="strips"></main>
<footer id="keys"></footer>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="ptitle">
      <div class="t" id="ptitle"></div>
      <input id="filter" placeholder="Filter" autocomplete="off" autocorrect="off">
      <button id="pwin">Plugin window</button>
      <button id="pbyp">Bypass</button>
      <button id="close">Done</button>
    </div>
    <div class="params" id="params"></div>
  </div>
</div>

<div class="gui" id="gui">
  <div class="gbar">
    <button id="gSliders">&lsaquo; Sliders</button>
    <div class="t" id="gtitle"></div>
    <button class="mod" data-mod="s">Shift</button>
    <button class="mod" data-mod="a">Option</button>
    <button class="mod" data-mod="m">Cmd</button>
    <button class="mod" data-mod="c">Ctrl</button>
    <button id="gRight">Right-click</button>
    <button id="gKbd">Keyboard</button>
    <div class="sepv"></div>
    <button id="gFit" style="display:none">Fit</button>
    <button id="gQual">Sharp</button>
    <button id="gByp">Bypass</button>
    <button id="gDone">Done</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="16" height="16"></canvas>
    <div class="gmsg" id="gmsg"><p id="gmsgText"></p><button id="gRetry">Try again</button></div>
    <div class="gstat" id="gstat"></div>
  </div>
  <input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</div>

<div class="sheet" id="eSheet" style="z-index:25">
  <div class="panel" style="height:84%">
    <div class="ptitle"><div class="t" id="eTitle"></div><input id="eFilter" placeholder="Search" autocomplete="off" autocorrect="off" style="display:none"><button id="eClose">Close</button></div>
    <div id="eBody" class="form"></div>
  </div>
</div>
<div class="note" id="note"></div>

<div class="sheet" id="menuSheet" style="z-index:30">
  <div class="panel" style="height:70%">
    <div class="ptitle"><button id="mBack" style="display:none">&lsaquo; Back</button><div class="t">Menu</div><button id="mCancel">Cancel</button></div>
    <div class="mlist" id="mlist"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null, view = null;            // view = [rack, slot] of the open plugin
let paramKey = '', touching = {};         // param index -> time of last touch
let lastOk = 0;

function post(cmd) {
  if (typeof live !== 'undefined' && live && live.readyState === 1) {
    live.send(JSON.stringify(Object.assign({ t: 'cmd' }, cmd)));
    return;
  }
  fetch('/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cmd) }).catch(() => {});
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  const s = state;
  $('scene').textContent = s.scene >= 0 ? s.scene + (s.sceneName ? '  ' + s.sceneName : '') : 'No snapshot';
  $('bpm').textContent = Number.isInteger(s.bpm) ? s.bpm : s.bpm.toFixed(1);

  // Pages
  let ph = `<button data-page="-1" class="${s.page < 0 ? 'on' : ''}">All</button>`;
  s.pages.forEach((p, i) => ph += `<button data-page="${i}" class="${s.page === i ? 'on' : ''}">${esc(p)}</button>`);
  $('pages').innerHTML = s.pages.length ? ph : '';

  // Strips
  let h = '';
  s.racks.forEach((r, ri) => {
    if (!r.visible) return;
    const sel = ri === s.selected;
    h += `<div class="strip ${sel ? 'sel' : ''} ${r.bypass ? 'byp' : ''}" style="--sel:${r.colour}">
      <div class="head" style="background:${r.colour}" data-select="${ri}"><span class="name">${esc(r.name)}</span><span class="tag">${esc(r.format)}</span>${r.group !== '-' ? `<span class="tag">${esc(r.group)}</span>` : ''}</div>
      <div class="slots">`;
    r.slots.forEach((sl, si) => {
      const open = view && view[0] === ri && view[1] === si;
      h += `<div class="slot ${sl.bypass ? 'byp' : ''} ${open ? 'open' : ''}" data-open="${ri}:${si}">${sl.sp ? '<span class="sp"></span>' : ''}<span class="n">${esc(sl.name)}</span>${sl.bypass ? '<span class="b">BYP</span>' : ''}</div>`;
    });
    if (!r.slots.length && !editing) h += `<div class="empty" style="padding:12px">No plugins</div>`;
    if (editing) h += `<button class="addp" data-addp="${ri}">+ Add plugin</button>`;
    h += `</div>
      <div class="meter"><i data-m="${ri}" style="width:${Math.round((r.level || 0) * 100)}%"></i></div>
      <div class="foot"><button class="${r.bypass ? 'byp' : ''}" data-bypass="${ri}">${r.bypass ? 'BYPASSED' : 'BYPASS'}</button><span class="gr" data-g="${ri}">${grText(r.gr || 0)}</span></div>
    </div>`;
  });
  const strips = $('strips'), scroll = strips.scrollLeft;
  if (editing) h += `<div class="addrack" data-addrack="1">+ Add rack</div>`;
  strips.innerHTML = h || '<div class="empty">No racks on this page</div>';
  strips.scrollLeft = scroll;

  // User Keys
  $('keys').innerHTML = s.keys.map((k, i) => `<button class="${k.lit ? 'lit' : ''}" data-key="${i}">${esc(k.label || 'Key ' + (i + 1))}</button>`).join('');

  // Show name and the edit button
  $('showBtn').innerHTML = esc(s.show || 'Show') + (s.edited ? ' <span class="dot">\u25CF</span>' : '');
  $('appsBtn').style.display = s.appWindows && s.apps && s.apps.length ? '' : 'none';
  if (s.note && s.note !== lastNote) { if (lastNote !== null) toast(s.note); lastNote = s.note; }
  else if (lastNote === null) lastNote = s.note || '';

  renderParams();
}

function renderParams() {
  let v = state && state.view;
  if (v && view && (v.rack !== view[0] || v.slot !== view[1])) v = null; // from before this plugin was tapped
  if (gui && gui.app !== undefined) { $('sheet').classList.remove('show'); return; }   // another app's window is open
  if (!view) { $('sheet').classList.remove('show'); if (gui) closeGui(); return; }
  if (!v) { if (!gui) $('sheet').classList.remove('show'); return; }
  if (gui) {
    $('sheet').classList.remove('show');
    $('gtitle').innerHTML = `<span>${esc(v.rackName)} &rsaquo;</span> ${esc(v.name)}`;
    $('gByp').classList.toggle('on', !!v.bypass);
    $('gByp').textContent = v.bypass ? 'Bypassed' : 'Bypass';
    return;
  }
  $('pwin').style.display = state.pluginWindows ? '' : 'none';
  $('sheet').classList.add('show');
  $('ptitle').innerHTML = `<span>${esc(v.rackName)} &rsaquo;</span> ${esc(v.name)}`;
  $('pbyp').classList.toggle('on', !!v.bypass);
  $('pbyp').textContent = v.bypass ? 'Bypassed' : 'Bypass';

  const f = $('filter').value.trim().toLowerCase();
  const list = v.params.filter(p => !f || p.name.toLowerCase().includes(f));
  const key = v.rack + ':' + v.slot + ':' + f + ':' + list.length;

  if (key !== paramKey) {
    // Build the rows once per plugin / filter
    paramKey = key;
    $('params').innerHTML = list.length ? list.map(p => `<div class="param" data-i="${p.i}">
        <div class="pn">${esc(p.name)}</div>
        ${p.ro ? `<div class="ro"><i style="width:${p.value * 100}%"></i></div>`
               : `<input type="range" min="0" max="1000" value="${Math.round(p.value * 1000)}" data-param="${p.i}" style="--p:${p.value * 100}%">`}
        <div class="pv">${esc(p.text)} ${esc(p.label)}</div></div>`).join('')
      : '<div class="empty">This plugin reports no parameters</div>';
    return;
  }

  // Update values in place (not the ones being dragged)
  const now = Date.now();
  for (const p of list) {
    const row = $('params').querySelector(`.param[data-i="${p.i}"]`);
    if (!row) continue;
    row.querySelector('.pv').textContent = `${p.text} ${p.label}`;
    if (p.ro) { const bar = row.querySelector('.ro i'); if (bar) bar.style.width = p.value * 100 + '%'; continue; }
    if (!(now - (touching[p.i] || 0) < 1500)) {
      const r = row.querySelector('input');
      r.value = Math.round(p.value * 1000);
      r.style.setProperty('--p', p.value * 100 + '%');
    }
  }
}

function grText(gr) { return gr >= 59 ? '-inf' : gr > 0.4 ? '-' + gr.toFixed(1) : ''; }

// The query: what the state should include
function currentQuery() {
  const parts = [];
  if (view) parts.push('view=' + view.join(':'));
  if (editing) parts.push('edit=1');
  return parts.join('&');
}

// A state arrived (live or polled)
// The LiveRack this page came from. If it's talking to a different one (LiveRack
// was updated while the iPad kept the old page open), load the new page, once.
const PAGE_VERSION = '%LIVERACK_VERSION%';
function checkVersion(v) {
  if (!v || PAGE_VERSION.charAt(0) === '%' || v === PAGE_VERSION) return;
  try {
    if (sessionStorage.getItem('liverack-reloaded-for') === v) return;
    sessionStorage.setItem('liverack-reloaded-for', v);
  } catch (e) {}
  location.reload();
}

function gotState(next, asked) {
  if (!next || !next.racks) return;
  checkVersion(next.version);
  // Live states carry no levels: keep the last ones until the meters arrive
  if (state && state.racks) next.racks.forEach((r, i) => {
    if (r.level === undefined) r.level = state.racks[i] ? state.racks[i].level || 0 : 0;
    if (r.gr === undefined) r.gr = state.racks[i] ? state.racks[i].gr || 0 : 0;
  });
  state = next;
  lastOk = Date.now();
  // The plugin may have moved or gone
  if (view && view.join(':') === asked && !state.view) view = null;
  render();
}

// Levels, ~20 a second over the live connection: only the meters are redrawn
function gotMeters(m) {
  lastOk = Date.now();
  if (!state || !state.racks) return;
  m.racks.forEach((mr, i) => {
    const r = state.racks[i];
    if (!r) return;
    r.level = mr.out;
    r.gr = Math.max(0, ...mr.gr);
    const bar = document.querySelector(`[data-m="${i}"]`);
    if (bar) bar.style.width = Math.round(r.level * 100) + '%';
    const g = document.querySelector(`[data-g="${i}"]`);
    if (g) g.textContent = grText(r.gr);
  });
}

// One connection that pushes changes as they happen; polling if it can't be used
let live = null, liveQuery = null, liveFails = 0, lastPing = 0;

function connectLive() {
  if (typeof WebSocket === 'undefined' || liveFails >= 3) return false;
  const q = currentQuery();
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/live?live=1' + (q ? '&' + q : ''));
  live = ws; liveQuery = q;
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.t === 'hello') liveFails = 0;
    else if (m.t === 'state') gotState(m.data, (liveQuery.match(/view=([\d:]+)/) || [])[1] || '');
    else if (m.t === 'meters') gotMeters(m.data);
    else if (m.t === 'pong') lastOk = Date.now();
  };
  ws.onclose = () => { if (live === ws) { live = null; liveFails++; } };
  return true;
}

async function poll() {
  if (live && live.readyState === 1) {
    // Live: just say what we want to see, and keep the connection warm
    const q = currentQuery();
    if (q !== liveQuery) {
      liveQuery = q;
      live.send(JSON.stringify({ t: 'query', q: 'live=1' + (q ? '&' + q : '') }));
    }
    if (Date.now() - lastPing > 4000) { lastPing = Date.now(); live.send('{"t":"ping"}'); }
  } else if (!live || live.readyState > 1) {
    if (!connectLive()) {
      try {
        const asked = view ? view.join(':') : '';
        const q = currentQuery();
        const res = await fetch('/state' + (q ? '?' + q : ''), { cache: 'no-store' });
        gotState(await res.json(), asked);
      } catch (e) {}
    }
  }
  const ok = Date.now() - lastOk < 2500;
  $('offline').style.display = ok ? 'none' : 'block';
  $('light').className = 'light ' + (ok ? 'ok' : 'bad');
  setTimeout(poll, 150);
}

// Taps
document.addEventListener('click', (e) => {

  if (t.dataset.key !== undefined) post({ cmd: 'key', index: +t.dataset.key });

//==============================================================================
// The plugin's own window, streamed from LiveRack. Touches become mouse clicks
// and drags, two fingers scroll, a two-finger tap right-clicks.

function loadPrefs() { try { return JSON.parse(localStorage.getItem('liverack-remote') || '{}'); } catch (e) { return {}; } }
function savePrefs() { try { localStorage.setItem('liverack-remote', JSON.stringify(prefs)); } catch (e) {} }
const prefs = loadPrefs();
const QUAL = { sharp: { scale: 2, q: 0.7, label: 'Sharp' }, fast: { scale: 1, q: 0.6, label: 'Fast' } };
let gui = null;             // { ws, rack, slot, ended }
const mods = new Set();
let rightOnce = false;

function quality() { return QUAL[prefs.quality] || QUAL.sharp; }

function openGui() {
  if (!view) return;
  prefs.window = true; savePrefs();
  gui = { rack: view[0], slot: view[1], ended: false, frames: 0, bytes: 0, statT: performance.now() };
  $('gSliders').style.display = ''; $('gByp').style.display = '';
  $('gui').classList.add('show');
  $('sheet').classList.remove('show');
  $('gQual').textContent = quality().label;
  showMsg('Opening the plugin window\u2026', false);
  connectGui(gui);
}

// Another app on the LiveRack computer (QRec, say), shown like a plugin window
function openApp(i) {
  if (gui) closeGui();
  view = null; $('sheet').classList.remove('show');
  const name = (state && state.apps && state.apps[i]) || 'App';
  gui = { app: i, name, ended: false, frames: 0, bytes: 0, statT: performance.now() };
  $('gSliders').style.display = 'none'; $('gByp').style.display = 'none';
  $('gtitle').textContent = name;
  $('gui').classList.add('show');
  $('gQual').textContent = quality().label;
  showMsg('Opening ' + name + '\u2026', false);
  connectGui(gui);
}
$('appsBtn').addEventListener('click', () => {
  const apps = (state && state.apps) || [];
  if (apps.length === 1) { openApp(0); return; }
  openSheet('Apps', '');
  $('eBody').innerHTML = apps.map((a, i) => `<div class="mitem" data-app="${i}"><span style="flex:1">${esc(a)}</span><span class="ar">&rsaquo;</span></div>`).join('')
    + '<div class="hint" style="margin-top:10px">These are the apps set to start with LiveRack (Devices, Server mode). Their windows show here like a plugin window.</div>';
  $('eBody').onclick = (ev) => { const b = ev.target.closest('[data-app]'); if (b) { closeSheet(); openApp(+b.dataset.app); } };
});

function closeGui() {
  const g = gui;
  gui = null;
  if (g && g.ws) { g.ended = true; try { g.ws.close(); } catch (e) {} }
  $('gui').classList.remove('show');
  $('menuSheet').classList.remove('show');
  $('kbd').blur();
}

function showMsg(text, retry) {
  $('gmsgText').textContent = text;
  $('gRetry').style.display = retry ? '' : 'none';
  $('gmsg').classList.toggle('show', !!text);
}

function connectGui(g) {
  const q = quality();
  const what = g.app !== undefined ? `app=${g.app}` : `view=${g.rack}:${g.slot}`;
  const ws = new WebSocket(`ws://${location.host}/view?${what}&scale=${q.scale}&q=${q.q}`);
  ws.binaryType = 'blob';
  g.ws = ws;
  g.ended = false;

  g.heard = performance.now();
  ws.onmessage = async (ev) => {
    if (gui !== g || g.ws !== ws) return;
    g.heard = performance.now();
    if (typeof ev.data === 'string') { guiText(g, JSON.parse(ev.data)); return; }
    try {
      const bmp = await createImageBitmap(ev.data);
      drawFrame(bmp);
      g.frames++; g.bytes += ev.data.size;
      if ($('gmsg').classList.contains('show') && !g.ended) showMsg('', false);
    } catch (e) {}
    if (ws.readyState === 1) ws.send('{"t":"ack"}');
  };
  ws.onclose = () => {
    if (gui !== g || g.ended || g.ws !== ws || document.hidden) return;
    showMsg('Reconnecting\u2026', false);
    setTimeout(() => { if (gui === g && !g.ended) connectGui(g); }, 1000);
  };
}

// iPadOS freezes Safari's pages in the background, which kills the stream.
// Let go while hidden, and pick straight back up on return.
function reconnectGui(g) {
  const old = g.ws;
  g.ws = null;
  if (old) { old.onclose = null; try { old.close(); } catch (e) {} }
  if (gui === g && !g.ended && !document.hidden) { showMsg('Reconnecting\u2026', false); connectGui(g); }
}
document.addEventListener('visibilitychange', () => {
  if (!gui || gui.ended) return;
  if (document.hidden) { const ws = gui.ws; gui.ws = null; if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} } }
  else reconnectGui(gui);
});

function guiText(g, m) {
  if (m.t === 'open') showMsg('', false);
  else if (m.t === 'error' || m.t === 'closed') { g.ended = true; showMsg(m.msg || 'The plugin window closed.', true); }
  else if (m.t === 'menu') showMenu(m.items || []);
  else if (m.t === 'menuEnd') $('menuSheet').classList.remove('show');
}

function sendGui(obj) {
  if (gui && gui.ws && gui.ws.readyState === 1) gui.ws.send(JSON.stringify(obj));
}

const cv = $('cv'), ctx = cv.getContext('2d');
function drawFrame(bmp) {
  if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; fitCanvas(); }
  ctx.drawImage(bmp, 0, 0);
  if (bmp.close) bmp.close();
}

// Pinch to zoom: the picture is scaled and moved; taps still land on the right spot
let zoom = { z: 1, x: 0, y: 0 };
function applyZoom() {
  if (zoom.z <= 1.01) zoom = { z: 1, x: 0, y: 0 };
  else {
    // Keep some of the picture on screen
    const w = cv.offsetWidth, h = cv.offsetHeight;
    zoom.x = Math.min(w * 0.5, Math.max(-w * zoom.z + w * 0.5, zoom.x));
    zoom.y = Math.min(h * 0.5, Math.max(-h * zoom.z + h * 0.5, zoom.y));
  }
  cv.style.transform = zoom.z === 1 ? '' : `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.z})`;
  $('gFit').style.display = zoom.z === 1 ? 'none' : '';
}
$('gFit').addEventListener('click', () => { zoom = { z: 1, x: 0, y: 0 }; applyZoom(); });

function fitCanvas() {
  zoom = { z: 1, x: 0, y: 0 }; applyZoom();
  const st = $('stage').getBoundingClientRect();
  const s = Math.min((st.width - 16) / cv.width, (st.height - 16) / cv.height);
  cv.style.width = Math.max(1, Math.floor(cv.width * s)) + 'px';
  cv.style.height = Math.max(1, Math.floor(cv.height * s)) + 'px';
}
window.addEventListener('resize', () => { if (gui) fitCanvas(); });

setInterval(() => {
  if (!gui) return;
  sendGui({ t: 'ping' });
  // Nothing heard for a while (not even a pong): the link is dead, start over
  if (!gui.ended && !document.hidden && gui.heard && performance.now() - gui.heard > 8000) reconnectGui(gui);
  const now = performance.now(), secs = (now - gui.statT) / 1000;
  if (secs > 0) $('gstat').textContent = `${Math.round(gui.frames / secs)} fps \u00b7 ${(gui.bytes / secs / 1048576).toFixed(1)} MB/s`;
  gui.frames = 0; gui.bytes = 0; gui.statT = now;
}, 2000);

// Touch handling
const pointers = new Map();
let mode = 'idle', pendTimer = null, primary = -1, startPos = null, startT = 0, lastPos = null;
let lastDown = { t: 0, x: -99, y: -99 }, clicks = 1;
let twoLast = null, twoMoved = false, moveQueued = null, wheelQueued = null, rafOn = false;

function norm(e) {
  const r = cv.getBoundingClientRect();
  return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
           cx: e.clientX, cy: e.clientY };
}
function modString() { return [...mods].join(''); }

function flush() {
  rafOn = false;
  if (moveQueued) { sendGui({ t: 'move', x: moveQueued.x, y: moveQueued.y, mods: modString() }); moveQueued = null; }
  if (wheelQueued) { sendGui(wheelQueued); wheelQueued = null; }
}
function queueFlush() { if (!rafOn) { rafOn = true; requestAnimationFrame(flush); } }

function beginDrag() {
  clearTimeout(pendTimer); pendTimer = null;
  mode = 'drag';
  const now = performance.now();
  const near = Math.hypot(startPos.cx - lastDown.x, startPos.cy - lastDown.y) < 30;
  clicks = (now - lastDown.t < 400 && near) ? Math.min(clicks + 1, 3) : 1;
  lastDown = { t: now, x: startPos.cx, y: startPos.cy };
  sendGui({ t: 'down', x: startPos.x, y: startPos.y, b: rightOnce ? 'r' : 'l', n: clicks, mods: modString() });
  if (lastPos && (lastPos.x !== startPos.x || lastPos.y !== startPos.y)) { moveQueued = lastPos; queueFlush(); }
}

function endDrag(pos) {
  flush();
  sendGui({ t: 'up', x: pos.x, y: pos.y, b: rightOnce ? 'r' : 'l', n: clicks, mods: modString() });
  if (rightOnce) { rightOnce = false; $('gRight').classList.remove('on'); }
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = norm(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 1) {
    mode = 'pending'; primary = e.pointerId; startPos = p; lastPos = p; startT = performance.now();
    pendTimer = setTimeout(beginDrag, 70);   // wait briefly: a second finger means scroll or right-click
  } else if (pointers.size === 2 && mode === 'pending') {
    clearTimeout(pendTimer); pendTimer = null;
    mode = 'two'; twoMoved = false; twoLast = mid(); twoStart = { dist: spread(), mid: mid(), zoom: { ...zoom } };
  }
});

let twoStart = null;
function spread() {
  const ps = [...pointers.values()];
  return Math.max(1, Math.hypot(ps[0].cx - ps[1].cx, ps[0].cy - ps[1].cy));
}

function mid() {
  const ps = [...pointers.values()];
  return { x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2, cx: (ps[0].cx + ps[1].cx) / 2, cy: (ps[0].cy + ps[1].cy) / 2 };
}

cv.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  e.preventDefault();
  const p = norm(e);
  pointers.set(e.pointerId, p);
  if (mode === 'pending' && e.pointerId === primary) {
    lastPos = p;
    if (Math.hypot(p.cx - startPos.cx, p.cy - startPos.cy) > 6) beginDrag();
  } else if (mode === 'drag' && e.pointerId === primary) {
    lastPos = p; moveQueued = p; queueFlush();
  } else if (mode === 'two' && pointers.size === 2 && !twoMoved
             && (Math.abs(spread() / twoStart.dist - 1) > 0.12
                 || (zoom.z > 1 && Math.hypot(mid().cx - twoStart.mid.cx, mid().cy - twoStart.mid.cy) > 10))) {
    // Fingers spreading or pinching, or moving while zoomed in: zoom and pan the picture rather than scroll the plugin
    mode = 'zoom';
  } else if (mode === 'zoom' && pointers.size === 2) {
    const m = mid(), s0 = twoStart.zoom;
    const z = Math.min(4, Math.max(1, s0.z * spread() / twoStart.dist));
    const r = cv.getBoundingClientRect();
    const left = r.left - zoom.x, top = r.top - zoom.y;               // where the unzoomed picture sits
    const px = (twoStart.mid.cx - left - s0.x) / s0.z, py = (twoStart.mid.cy - top - s0.y) / s0.z;
    zoom = { z, x: m.cx - left - px * z, y: m.cy - top - py * z };    // the point under the fingers stays under them
    applyZoom();
  } else if (mode === 'two' && pointers.size === 2) {
    const m = mid(), dx = m.cx - twoLast.cx, dy = m.cy - twoLast.cy;
    if (Math.abs(m.cx - twoStart.mid.cx) + Math.abs(m.cy - twoStart.mid.cy) > 10) twoMoved = true;
    if (twoMoved) {
      const prev = wheelQueued || { dx: 0, dy: 0 };
      wheelQueued = { t: 'wheel', x: m.x, y: m.y, dx: prev.dx + dx * 2, dy: prev.dy + dy * 2, mods: modString() };
      queueFlush();
    }
    twoLast = m;
  }
});

function pointerEnd(e) {
  if (!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (mode === 'pending' && e.pointerId === primary) { beginDrag(); endDrag(p); mode = 'idle'; }
  else if (mode === 'drag' && e.pointerId === primary) { endDrag(p); mode = 'idle'; }
  else if (mode === 'zoom') { if (pointers.size === 0) mode = 'idle'; }
  else if (mode === 'two' && pointers.size === 0) {
    flush();
    if (!twoMoved && performance.now() - startT < 500) {
      sendGui({ t: 'down', x: startPos.x, y: startPos.y, b: 'r', n: 1, mods: modString() });
      sendGui({ t: 'up', x: startPos.x, y: startPos.y, b: 'r', n: 1, mods: modString() });
    }
    mode = 'idle';
  }
  if (pointers.size === 0 && mode !== 'idle' && mode !== 'two' && mode !== 'zoom') mode = 'idle';
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

// Toolbar
document.querySelectorAll('.mod').forEach(b => b.addEventListener('click', () => {

}));
$('gRight').addEventListener('click', () => { rightOnce = !rightOnce; $('gRight').classList.toggle('on', rightOnce); });
$('gSliders').addEventListener('click', () => { prefs.window = false; savePrefs(); closeGui(); paramKey = ''; renderParams(); });
$('pwin').addEventListener('click', () => openGui());
$('gDone').addEventListener('click', () => { closeGui(); view = null; paramKey = ''; $('sheet').classList.remove('show'); });
$('gByp').addEventListener('click', () => view && post({ cmd: 'slotBypass', rack: view[0], slot: view[1], value: -1 }));
$('gRetry').addEventListener('click', () => { if (gui) { showMsg(gui.app !== undefined ? 'Opening ' + gui.name + '\u2026' : 'Opening the plugin window\u2026', false); connectGui(gui); } });

// Typing into the plugin: a hidden text field brings up the iPad keyboard.

const kbd = $('kbd');
function resetKbd() { kbd.value = ' '; try { kbd.setSelectionRange(1, 1); } catch (e) {} }
$('gKbd').addEventListener('click', () => { resetKbd(); kbd.focus(); });

// A plugin's own popup menu, as a touch list
let menuItems = [], menuPath = [];
function showMenu(items) { menuItems = items; menuPath = []; renderMenu(); $('menuSheet').classList.add('show'); }
function renderMenu() {

}

//==============================================================================
// Edit mode: build the show from here (racks, plugins, routing, shows), so a
// LiveRack server needs no screen.
let editing = false, lastNote = null, noteTimer = null, library = null;

function toast(text) {

  $('note').classList.add('show');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => $('note').classList.remove('show'), 3500);

function openSheet(title, html, withSearch) {
  $('eTitle').textContent = title;
  $('eBody').innerHTML = html;
  $('eFilter').style.display = withSearch ? '' : 'none';
  $('eFilter').value = '';
  $('eSheet').classList.add('show');
}
function closeSheet() { $('eSheet').classList.remove('show'); $('eBody').innerHTML = ''; }
$('eClose').addEventListener('click', closeSheet);
$('eSheet').addEventListener('click', (e) => { if (e.target === $('eSheet')) closeSheet(); });

// Taps on the strips while editing. Returns true when handled.
function editClick(e) {
  const t = e.target.closest('[data-addp],[data-addrack],[data-select],[data-open]');
  if (!t || !state) return false;
  if (t.dataset.addp !== undefined) { pluginPicker(+t.dataset.addp); return true; }
  if (t.dataset.addrack !== undefined) { rackSheet(-1); return true; }
  if (t.dataset.select !== undefined) { rackSheet(+t.dataset.select); return true; }
  if (t.dataset.open !== undefined) { slotSheet(...t.dataset.open.split(':').map(Number)); return true; }
  return false;
}

// What a plugin can do while editing
function slotSheet(r, s) {
  const rack = state.racks[r], slot = rack && rack.slots[s];
  if (!slot) return;
  const n = rack.slots.length;
  openSheet(rack.name + ' \u203A ' + slot.name, `
    <button data-act="up" ${s === 0 ? 'disabled' : ''}>Move up</button>
    <button data-act="down" ${s === n - 1 ? 'disabled' : ''}>Move down</button>
    <button data-act="sliders">Parameters</button>
    <button data-act="remove" class="danger">Remove ${esc(slot.name)}</button>`);
  $('eBody').onclick = (ev) => {
    const a = ev.target.closest('[data-act]');
    if (!a || a.disabled) return;
    const act = a.dataset.act;
    if (act === 'up')     post({ cmd: 'movePlugin', rack: r, slot: s, to: s - 1 });
    if (act === 'down')   post({ cmd: 'movePlugin', rack: r, slot: s, to: s + 1 });
    if (act === 'remove') post({ cmd: 'removePlugin', rack: r, slot: s });
    if (act === 'sliders') { closeSheet(); view = [r, s]; paramKey = ''; $('filter').value = ''; post({ cmd: 'select', rack: r, slot: s }); return; }
    closeSheet();
  };
}

// The plugin list (fetched once when the picker opens)
async function pluginPicker(r) {
  openSheet('Add to ' + state.racks[r].name, '<div class="empty">Loading plugins...</div>', true);
  try {
    const res = await fetch('/state?lib=1', { cache: 'no-store' });
    library = (await res.json()).library || [];
  } catch (e) { library = library || []; }
  const draw = () => {
    const f = $('eFilter').value.trim().toLowerCase();
    const list = library.filter(p => !f || (p.name + ' ' + p.maker + ' ' + p.cat).toLowerCase().includes(f))
                        .sort((a, b) => a.name.localeCompare(b.name));
    $('eBody').innerHTML = list.length ? list.slice(0, 300).map(p =>
        `<div class="mitem" data-key="${esc(p.key)}"><span style="flex:1">${esc(p.name)}<br><span class="pcat">${esc(p.maker)}</span></span><span class="pcat">${esc(p.cat)}</span></div>`).join('')
      : `<div class="empty">${library.length ? 'No plugin matches' : 'No plugins scanned yet. Scan on the LiveRack computer (Plugins).'}</div>`;
  };
  $('eFilter').oninput = draw;
  $('eBody').onclick = (ev) => {
    const row = ev.target.closest('[data-key]');
    if (!row) return;
    post({ cmd: 'addPlugin', rack: r, key: row.dataset.key });
    closeSheet();
  };
  draw();
}

// Channel choices for a driver
function channelOptions(names, chosen, count) {
  const n = names && names.length ? names.length : 64;
  let o = '';
  for (let i = 0; i < Math.max(n, chosen + 1); i++)
    o += `<option value="${i}" ${i === chosen ? 'selected' : ''}>${i + 1}${names && names[i] ? '  ' + esc(names[i]) : ''}</option>`;
  return o;
}

// A rack's setup (r = -1 for a new rack)
function rackSheet(r) {
  const isNew = r < 0;
  const rack = isNew ? { name: 'Rack ' + (state.racks.length + 1), stereo: false, m2s: false, driver: 0, in: [0, 1], out: [0, 1], console: 0, safe: false } : state.racks[r];
  if (!rack) return;
  const drivers = state.drivers || [];
  let fmt = rack.stereo ? 'stereo' : rack.m2s ? 'm2s' : 'mono';
  let drv = rack.driver;

  const draw = () => {
    const d = drivers[drv] || { ins: [], outs: [] };
    const twoIn = fmt === 'stereo', twoOut = fmt !== 'mono';
    const val = (id, dflt) => { const el = $(id); return el ? el.value : dflt; };
    const cur = {
      name: val('rName', rack.name), console: val('rCon', rack.console),
      in0: +val('rIn0', rack.in[0]), in1: +val('rIn1', rack.in[1]), out0: +val('rOut0', rack.out[0]), out1: +val('rOut1', rack.out[1]),
      safe: $('rSafe') ? $('rSafe').classList.contains('on') : rack.safe
    };
    $('eBody').innerHTML = `
      <label>Name<input type="text" id="rName" value="${esc(cur.name)}" autocomplete="off"></label>
      <label>Format<div class="seg">
        <button data-fmt="mono" class="${fmt === 'mono' ? 'on' : ''}">Mono</button>
        <button data-fmt="stereo" class="${fmt === 'stereo' ? 'on' : ''}">Stereo</button>
        <button data-fmt="m2s" class="${fmt === 'm2s' ? 'on' : ''}">Mono &gt; Stereo</button></div></label>
      ${drivers.length > 1 ? `<label>Audio driver<select id="rDrv">${drivers.map((x, i) => `<option value="${i}" ${i === drv ? 'selected' : ''}>${i + 1}: ${esc(x.name)}</option>`).join('')}</select></label>` : ''}
      ${isNew ? '' : `<div class="row">
        <label>Input ${twoIn ? 'L' : ''}<select id="rIn0">${channelOptions(d.ins, cur.in0)}</select></label>
        ${twoIn ? `<label>Input R<select id="rIn1">${channelOptions(d.ins, cur.in1)}</select></label>` : ''}</div>
      <div class="row">
        <label>Output ${twoOut ? 'L' : ''}<select id="rOut0">${channelOptions(d.outs, cur.out0)}</select></label>
        ${twoOut ? `<label>Output R<select id="rOut1">${channelOptions(d.outs, cur.out1)}</select></label>` : ''}</div>`}
      ${isNew ? '<div class="hint">A new rack takes the next free channels. Tap its name afterwards to change them.</div>' : ''}
      <div class="row">
        <label>Console channel<input type="number" id="rCon" min="0" value="${esc(cur.console)}"></label>
        <label>Recall safe<button id="rSafe" class="${cur.safe ? 'on' : ''}">${cur.safe ? 'Safe' : 'Off'}</button></label></div>
      <button class="primary" id="rSave">${isNew ? 'Add rack' : 'Save'}</button>
      ${!isNew && (fmt !== (rack.stereo ? 'stereo' : rack.m2s ? 'm2s' : 'mono')) && rack.slots.length ? '<div class="hint">Changing the format re-prepares its plugins: this rack drops out for a moment.</div>' : ''}
      ${isNew ? '' : '<div class="ask" id="rAsk" style="display:none">Remove this rack and its plugins?<div class="row"><button class="danger" id="rYes">Remove</button><button id="rNo">Cancel</button></div></div><button class="danger" id="rRemove">Remove rack</button>'}`;
  };

  openSheet(isNew ? 'New rack' : rack.name, '');
  draw();
  $('eBody').onclick = (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.fmt) { fmt = b.dataset.fmt; draw(); return; }
    if (b.id === 'rSafe') { b.classList.toggle('on'); b.textContent = b.classList.contains('on') ? 'Safe' : 'Off'; return; }
    if (b.id === 'rRemove') { $('rAsk').style.display = ''; b.style.display = 'none'; return; }
    if (b.id === 'rNo') { $('rAsk').style.display = 'none'; $('rRemove').style.display = ''; return; }
    if (b.id === 'rYes') { post({ cmd: 'removeRack', rack: r }); closeSheet(); return; }
    if (b.id === 'rSave') {
      const cmd = { cmd: isNew ? 'addRack' : 'rackConfig', name: $('rName').value, format: fmt, driver: drv,
                    console: +$('rCon').value || 0, safe: $('rSafe').classList.contains('on') };
      if (!isNew) {
        cmd.rack = r;
        const in0 = +$('rIn0').value, out0 = +$('rOut0').value;
        cmd.in = [in0, $('rIn1') ? +$('rIn1').value : in0 + 1];
        cmd.out = [out0, $('rOut1') ? +$('rOut1').value : out0 + 1];
      }
      post(cmd);
      closeSheet();
    }
  };
  $('eBody').onchange = (ev) => { if (ev.target.id === 'rDrv') { drv = +ev.target.value; draw(); } };
}

// Shows: save, save as, new, open
async function showSheet() {
  let shows = [], recent = [];
  try {
    const st = await (await fetch('/state?edit=1', { cache: 'no-store' })).json();
    shows = st.shows || [];
    recent = st.recent || [];
  } catch (e) {}
  let pending = null; // an action waiting for "save first?"

  const draw = () => {
    $('eBody').innerHTML = `
      ${state.edited ? '<div class="hint">This show has changes that aren\u2019t saved.</div>' : ''}
      ${pending ? `<div class="ask">Save the current show first?<div class="row">
          ${state.hasShowFile ? '<button class="primary" data-ans="save">Save first</button>' : ''}
          <button data-ans="discard">${state.hasShowFile ? 'Don\u2019t save' : 'Discard changes'}</button><button data-ans="cancel">Cancel</button></div></div>` : ''}
      ${state.hasShowFile ? '<button class="primary" data-sh="save">Save</button>' : ''}
      <div class="row"><input type="text" id="sName" placeholder="Show name" autocomplete="off" style="height:46px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;font-size:16px">
        <button data-sh="saveas" style="flex:0 0 auto">${state.hasShowFile ? 'Save as' : 'Save'}</button></div>
      <button data-sh="new">New show</button>
      ${recent.length ? `<label style="margin-top:6px">Recent</label>` + recent.map((x, i) => `<div class="mitem" data-open-recent="${i}"><span class="ck">${x.current ? '\u2713' : ''}</span><span style="flex:1">${esc(x.name)}</span><span style="color:var(--dim);font-size:13px">${esc(x.folder)}</span></div>`).join('') : ''}
      <label style="margin-top:6px">Open</label>
      ${shows.length ? shows.map((x, i) => `<div class="mitem" data-open-show="${i}"><span class="ck">${x.current ? '\u2713' : ''}</span><span style="flex:1">${esc(x.name)}</span></div>`).join('')
                     : '<div class="hint">No shows saved yet. Shows are saved in Documents/LiveRack Shows on the LiveRack computer.</div>'}
      ${state.version ? `<div class="hint" style="margin-top:10px;text-align:center">LiveRack ${esc(state.version)}</div>` : ''}`;
  };

  const run = (action, save) => {
    if (action.cmd === 'showOpen' || action.cmd === 'showOpenRecent' || action.cmd === 'showNew') action.save = !!save;
    post(action);
    closeSheet();
  };
  const guarded = (action) => {
    if (state.edited) { pending = action; draw(); $('eBody').scrollTop = 0; }
    else run(action, false);
  };

  openSheet(state.show || 'Show', '');
  draw();
  $('eBody').onclick = (ev) => {
    const b = ev.target.closest('[data-sh],[data-ans],[data-open-show],[data-open-recent]');
    if (!b) return;
    if (b.dataset.ans) {
      const a = pending; pending = null;
      if (b.dataset.ans === 'cancel' || !a) { draw(); return; }
      run(a, b.dataset.ans === 'save');
      return;
    }
    if (b.dataset.openRecent !== undefined) { const x = recent[+b.dataset.openRecent]; guarded({ cmd: 'showOpenRecent', index: x.index }); return; }
    if (b.dataset.openShow !== undefined) { const x = shows[+b.dataset.openShow]; guarded({ cmd: 'showOpen', folder: x.folder, name: x.name }); return; }
    const sh = b.dataset.sh;
    if (sh === 'save') { post({ cmd: 'showSave' }); closeSheet(); }
    if (sh === 'saveas') {
      const name = $('sName').value.trim();
      if (!name) { $('sName').focus(); return; }
      if (shows.some(x => x.folder === 0 && x.name.toLowerCase() === name.toLowerCase()) && !confirm('Replace the show "' + name + '"?')) return;
      post({ cmd: 'showSave', name }); closeSheet();
    }
    if (sh === 'new') guarded({ cmd: 'showNew' });
  };
}
$('showBtn').addEventListener('click', () => state && showSheet());

poll();
</script>
