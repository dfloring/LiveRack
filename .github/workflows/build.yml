name: Build

# Builds the Mac app and the Companion module on every push and pull request.
# Pushing a tag like v0.10.0 also makes a GitHub Release with both attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-app:
    name: Mac app (Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release -- -quiet

      - name: Package
        run: |
          APP=$(find build -name LiveRack.app -maxdepth 5 -type d | head -1)
          echo "Built: $APP"
          codesign --force --deep --sign - "$APP"   # ad-hoc signature so Apple silicon will run it
          VERSION=$(grep -m1 'project(LiveRack VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          ditto -c -k --keepParent "$APP" "LiveRack-$VERSION-mac-arm64.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiveRack-mac
          path: LiveRack-*-mac-arm64.zip

  windows-app:
    name: Windows app (x64, ASIO)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the ASIO SDK (Steinberg, GPLv3 option)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force asio | Out-Null
          try {
            Invoke-WebRequest -Uri https://www.steinberg.net/asiosdk -OutFile asiosdk.zip -MaximumRedirection 10
            Expand-Archive asiosdk.zip -DestinationPath asio -Force
          } catch {
            Write-Host "Steinberg download failed ($_), using a mirror"
            git clone --depth 1 https://github.com/jcelerier/asio-2 asio/asio-2
          }
          $header = Get-ChildItem -Recurse -Filter iasiodrv.h asio | Select-Object -First 1
          if (-not $header) { throw "ASIO SDK not found" }
          $sdk = $header.Directory.Parent.FullName
          Write-Host "ASIO SDK: $sdk"
          "ASIO_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: cmake -B build -A x64 -DASIO_SDK_DIR="${{ env.ASIO_SDK_DIR }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter LiveRack.exe build | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          Write-Host "Built: $($exe.FullName)"
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(LiveRack VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item $exe.FullName pkg/
          Copy-Item LICENSE pkg/LICENSE.txt
          Compress-Archive -Path pkg/* -DestinationPath "LiveRack-$version-windows-x64.zip"
          Get-ChildItem *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiveRack-windows
          path: LiveRack-*-windows-x64.zip

  companion-module:
    name: Companion module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-module-liverack-host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check
        run: npx companion-module-check || true

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: companion-module
          path: companion-module-liverack-host/*.tgz

  release:
    name: Release
    # A new version number on main (CMakeLists.txt) makes a GitHub Release once
    # everything has built; pushing a v* tag does the same
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [mac-app, windows-app, companion-module]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'project(LiveRack VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LiveRack ${{ steps.v.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Downloads**
            - **Mac (Apple silicon):** `LiveRack-${{ steps.v.outputs.version }}-mac-arm64.zip`. First launch: right-click LiveRack.app > Open (it isn't notarised).
            - **Windows (x64, ASIO):** `LiveRack-${{ steps.v.outputs.version }}-windows-x64.zip`. Windows may warn that it's from an unknown publisher: More info > Run anyway.
            - **Companion 5 module:** the `.tgz`. In Companion: Modules > Import module package.
